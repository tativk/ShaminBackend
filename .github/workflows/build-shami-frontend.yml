name: Build Shami Gallery deployable frontend

on:
  push:
    branches:
      - shami-frontend-final-2026-11-12
    paths:
      - "frontend/**"
      - ".github/workflows/build-shami-frontend.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build and package frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        working-directory: frontend
        continue-on-error: true
        env:
          CI: "true"
          REACT_APP_API_URL: "https://api.shamingallery.ir/api"
          REACT_APP_SITE_URL: "https://shamingallery.ir"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Create production build
        working-directory: frontend
        env:
          CI: "false"
          REACT_APP_API_URL: "https://api.shamingallery.ir/api"
          REACT_APP_SITE_URL: "https://shamingallery.ir"
        run: npm run build

      - name: Verify and package static site
        working-directory: frontend
        run: |
          test -s build/index.html
          test -s build/asset-manifest.json
          cd build
          zip -qr ../ShamiGallery-Frontend-FINAL.zip .
          unzip -t ../ShamiGallery-Frontend-FINAL.zip
          test -s ../ShamiGallery-Frontend-FINAL.zip

      - name: Upload deployable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShamiGallery-Frontend-FINAL
          path: frontend/ShamiGallery-Frontend-FINAL.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shami-frontend-final-build-2026-11-12-v2
          name: Shami Gallery Frontend Final Build 2026-11-12 v2
          target_commitish: ${{ github.sha }}
          body: |
            Production frontend build for Shami Gallery.
            Built from branch shami-frontend-final-2026-11-12.
            This is a preview release; review the site before deploying to production.
          prerelease: true
          make_latest: false
          files: frontend/ShamiGallery-Frontend-FINAL.zip

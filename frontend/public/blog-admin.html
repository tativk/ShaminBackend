<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>مدیریت وبلاگ | گالری شمین</title><meta name="robots" content="noindex, nofollow"/><style>
*{box-sizing:border-box;font-family:Vazirmatn,Tahoma,sans-serif}
body{margin:0;background:#f4f1ea;color:#1c2b25}
header{background:#0e2f24;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1rem;margin:0}
header button{background:#e8c67a;border:0;padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:700}
main{max-width:960px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:.95rem;margin-top:4px}
label{display:block;font-size:.85rem;font-weight:700;margin-top:12px;color:#3d5a4e}
button.primary{background:#0e2f24;color:#fff;border:0;padding:10px 22px;border-radius:8px;cursor:pointer;font-weight:700;margin-top:16px}
button.danger{background:#b3392f;color:#fff;border:0;padding:8px 16px;border-radius:8px;cursor:pointer}
button.ghost{background:#e7efe9;border:0;padding:8px 16px;border-radius:8px;cursor:pointer}
.row{display:flex;gap:12px}.row>div{flex:1}
.post-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:10px}
.post-item strong{flex:1}
.sec{border:1px dashed #bbb;border-radius:10px;padding:12px;margin-top:10px;background:#faf8f2}
.sec .row{margin-top:8px}
.msg{padding:10px;border-radius:8px;margin-top:12px;font-size:.9rem}
.msg.ok{background:#e3f4e8;color:#0e2f24}.msg.err{background:#fde8e8;color:#8a1f1f}
.badge{font-size:.72rem;padding:3px 10px;border-radius:999px;background:#e3f4e8;color:#0e2f24}
.badge.off{background:#f4e3e3;color:#8a1f1f}
.hidden{display:none}
h2{font-size:1rem;color:#0e2f24;margin:8px 0 4px}
</style></head><body>
<header><h1>📝 مدیریت وبلاگ — گالری شمین</h1><button id="logoutBtn" class="hidden">خروج</button></header>
<main>
  <div id="loginCard" class="card">
    <h2>ورود مدیر</h2>
    <div class="row"><div><label>شماره موبایل</label><input id="phone" placeholder="09123456789" inputmode="numeric"/></div>
    <div><label>رمز عبور</label><input id="pass" type="password"/></div></div>
    <button class="primary" onclick="login()">ورود</button>
    <div id="loginMsg" class="msg hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>مقاله‌ها</h2>
      <div id="postsList"></div>
      <button class="primary" onclick="newPost()">+ مقاله جدید</button>
    </div>

    <div id="editor" class="card hidden">
      <h2 id="edTitle">مقاله جدید</h2>
      <div><label>عنوان</label><input id="f_title"/></div><input id="f_slug" type="hidden"/>
      <div class="row"><div><label>دسته</label><input id="f_category" placeholder="عطر و ادکلن"/></div><div><label>تاریخ</label><input id="f_date" placeholder="۱۴۰۴/۰۶/۲۶"/></div></div>
      <div class="row"><div><label>زمان مطالعه</label><input id="f_rt" placeholder="۶ دقیقه مطالعه"/></div><div><label>نویسنده</label><input id="f_author"/></div></div>
      <div class="row"><div><label>عکس مقاله (از گالری گوشی یا کامپیوتر)</label><input type="file" id="f_image_file" accept="image/*" onchange="uploadImage(this)"/><input id="f_image" type="hidden"/><div id="imgPrev"></div></div><div><label>توضیح عکس</label><input id="f_cap"/></div></div>
      <label>چکیده</label><textarea id="f_excerpt" rows="3"></textarea>
      <label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" id="f_pub" style="width:auto" checked/> منتشر شده</label>
      <h2 style="margin-top:18px">بخش‌های محتوا</h2>
      <div id="sections"></div>
      <button class="ghost" onclick="addSection()">+ بخش جدید</button>
      <div class="row" style="margin-top:18px"><div><button class="primary" onclick="savePost()">💾 ذخیره</button></div><div style="text-align:left"><button class="ghost" onclick="closeEditor()">انصراف</button></div></div>
      <div id="edMsg" class="msg hidden"></div>
    </div>
    <div id="listMsg" class="msg hidden"></div>
  </div>
</main>
<script>
const API='https://api.shamingallerry.ir/api';
let TOKEN=null, editingSlug=null, sections=[];

const el=id=>document.getElementById(id);
const show=(id,on)=>el(id).classList.toggle('hidden',!on);
const msg=(id,text,ok)=>{const m=el(id);m.textContent=text;m.className='msg '+(ok?'ok':'err');show(id,true)};

async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,...(opts.headers||{})}});
  if(r.status===401){logout();throw new Error('نشست منقضی شده؛ دوباره وارد شوید.');}
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||Object.values(d).flat()[0]||('خطا '+r.status));}
  return r.status===204?null:r.json();
}

async function login(){
  try{
    const r=await fetch(API+'/auth/login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:el('phone').value.trim(),password:el('pass').value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'ورود ناموفق');
    if(d.user&&d.user.role!=='admin')throw new Error('این حساب دسترسی ادمین ندارد.');
    TOKEN=d.access;sessionStorage.setItem('bt',TOKEN);show('loginCard',false);show('panel',true);show('logoutBtn',true);loadPosts();
  }catch(e){msg('loginMsg',e.message,false);}
}
function logout(){TOKEN=null;sessionStorage.removeItem('bt');sessionStorage.removeItem('access');sessionStorage.removeItem('access_token');localStorage.removeItem('access');localStorage.removeItem('access_token');localStorage.removeItem('refresh');location.href='/admin';}

async function loadPosts(){
  try{
    const list=await api('/blog-admin/');window.__posts=list;
    el('postsList').innerHTML=list.map(p=>
      '<div class="post-item"><div><strong>'+p.title+'</strong> <span class="badge'+(p.is_published?'':' off')+'">'+(p.is_published?'منتشر شده':'پیش‌نویس')+'</span><div style="font-size:.75rem;color:#888" dir="ltr">/blog/'+p.slug+'</div></div>'+
      '<div><button class="ghost" onclick=\'editPost("'+p.slug+'")\'>ویرایش</button> <button class="danger" onclick=\'delPost("'+p.slug+'")\'>حذف</button></div></div>').join('')||'<p>هنوز مقاله‌ای نیست.</p>';
  }catch(e){msg('listMsg',e.message,false);}
}

function renderSections(){el('sections').innerHTML=sections.map((s,i)=>{
  return '<div class="sec"><div class="row"><div><label>نوع بخش</label><select onchange="sections['+i+'].type=this.value;renderSections()">'+
    ['lead','paragraph','heading','quote','list'].map(t=>'<option value="'+t+'"'+(s.type===t?' selected':'')+'>'+({lead:'لید (مقدمه)',paragraph:'پاراگراف',heading:'تیتر',quote:'نقل‌قول',list:'فهرست'})[t]+'</option>').join('')+'</select></div>'+
    '<div style="align-self:end"><button class="danger" onclick="sections.splice('+i+',1);renderSections()">حذف بخش</button></div></div>'+
    '<label>متن</label><textarea rows="3" oninput="sections['+i+'].text=this.value">'+(s.text||'')+'</textarea>'+
    (s.type==='list'?'<label>آیتم‌ها (هر خط یک آیتم)</label><textarea rows="4" oninput="sections['+i+'].items=this.value.split(\'\\n\')">'+(s.items||[]).join('\n')+'</textarea>':'')+
    '</div>';}).join('');}
function addSection(){sections.push({type:'paragraph',text:''});renderSections();}

async function uploadImage(input){const f=input.files&&input.files[0];if(!f)return;
  const fd=new FormData();fd.append('image',f);
  try{const r=await fetch(API+'/blog-admin/upload/',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||'آپلود ناموفق');
    el('f_image').value=d.url;showPreview(d.url);msg('edMsg','عکس آپلود شد ✓',true);}catch(e){msg('edMsg',e.message,false);input.value='';}}
function showPreview(u){el('imgPrev').innerHTML=u?'<img src="'+u+'" style="max-height:120px;border-radius:8px;margin-top:6px"/>':'';}
function newPost(){editingSlug=null;el('edTitle').textContent='مقاله جدید';
  ['title','slug','category','date','rt','author','image','cap','excerpt'].forEach(f=>el('f_'+f).value='');
  el('f_pub').checked=true;sections=[{type:'lead',text:''}];renderSections();showPreview('');el('f_image_file').value='';
  show('editor',true);show('listMsg',false);}
function editPost(slug){
  const p=(window.__posts||[]).find(x=>x.slug===slug);if(!p)return;
  editingSlug=slug;el('edTitle').textContent='ویرایش: '+p.title;
  el('f_title').value=p.title;el('f_slug').value=p.slug;el('f_category').value=p.category||'';
  el('f_date').value=p.date||'';el('f_rt').value=p.reading_time||'';el('f_author').value=p.author||'';
  el('f_image').value=p.image||'';el('f_cap').value=p.image_caption||'';showPreview(p.image||'');el('f_excerpt').value=p.excerpt||'';
  el('f_pub').checked=!!p.is_published;sections=JSON.parse(JSON.stringify(p.sections||[]));renderSections();
  show('editor',true);show('listMsg',false);window.scrollTo({top:el('editor').offsetTop-20,behavior:'smooth'});}
function closeEditor(){show('editor',false);}

function genSlug(title){let s=(title||'').trim().toLowerCase().replace(/[\s\u200c]+/g,'-').replace(/[^\u0621-\u064Aa-z0-9\-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');if(!s)s='post-'+Date.now();const taken=(window.__posts||[]).map(p=>p.slug);let base=s,i=2;while(taken.includes(s)){s=base+'-'+i;i++;}return s;}
async function savePost(){
  try{
    const body={title:el('f_title').value.trim(),slug:'',category:el('f_category').value.trim(),
      date:el('f_date').value.trim(),reading_time:el('f_rt').value.trim(),author:el('f_author').value.trim(),
      image:el('f_image').value.trim(),image_caption:el('f_cap').value.trim(),excerpt:el('f_excerpt').value.trim(),
      sections:sections,is_published:el('f_pub').checked};
    if(!body.title)throw new Error('عنوان الزامی است.');body.slug=editingSlug||genSlug(body.title);
    if(editingSlug)await api('/blog-admin/'+encodeURIComponent(editingSlug)+'/',{method:'PUT',body:JSON.stringify(body)});
    else await api('/blog-admin/',{method:'POST',body:JSON.stringify(body)});
    msg('edMsg','ذخیره شد ✓',true);show('editor',false);loadPosts();
  }catch(e){msg('edMsg',e.message,false);}
}
async function delPost(slug){if(!confirm('این مقاله حذف شود؟'))return;
  try{await api('/blog-admin/'+encodeURIComponent(slug)+'/',{method:'DELETE'});loadPosts();}catch(e){msg('listMsg',e.message,false);}}

(async()=>{const t=sessionStorage.getItem('bt')||localStorage.getItem('access')||localStorage.getItem('access_token')||sessionStorage.getItem('access')||sessionStorage.getItem('access_token');if(!t)return;TOKEN=t;
  try{const r=await fetch(API+'/auth/profile/',{headers:{Authorization:'Bearer '+t}});const u=await r.json();
  if(r.ok&&u.role==='admin'){show('loginCard',false);show('panel',true);show('logoutBtn',true);loadPosts();}
  else sessionStorage.removeItem('bt');}catch(e){}})();
</script></body></html>
